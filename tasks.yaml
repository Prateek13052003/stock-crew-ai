find_trending_companies:
  description: >
    Search the web RIGHT NOW for the top 3–5 trending companies in the stock 
    market today ({current_date}). Use your search tool to find recent news, 
    earnings reports, and momentum. Do NOT rely on prior knowledge.
  expected_output: >
    List of companies with name, ticker, reason for trending, and the news 
    source/headline that made them trend today.
  agent: researcher

research_trending_companies:
  description: >
    For each company identified, use your search tool to research their latest 
    earnings, analyst ratings, recent price movement, and news from the past 
    7 days. Do NOT use prior knowledge — search for everything.
  expected_output: >
    Detailed research for each company with specific numbers and recent headlines.
  agent: analyst

pick_best_company:
  description: >
    Analyze all researched companies and pick the best one for investment based 
    on risk-reward and future outlook.
  expected_output: >
    Best company with justification and reasoning
  agent: reporting_analyst