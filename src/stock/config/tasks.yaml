find_trending_companies:
  description: >
    Search the web for the top 3 trending publicly traded companies
    in the {sector} sector as of {current_date}.

    Use the search tool.

    Focus only on companies trending because of:
    - earnings
    - major news
    - analyst ratings
    - product launches
    - mergers
    - partnerships

  expected_output: >
    Return ONLY 3 companies.

    For each company provide:
    - company name
    - ticker
    - one-line reason
    - one news headline
    - one source
    - publication date

  agent: researcher


research_trending_companies:
  description: >
    Research the 3 companies using current web information.

    Use the search tool.

    Keep every analysis concise.

  expected_output: >
    For each company provide:

    - revenue summary (1 sentence)
    - earnings summary (1 sentence)
    - market position (1 sentence)
    - analyst sentiment (1 sentence)
    - 2 growth catalysts
    - 2 risks
    - investment potential (maximum 50 words)
    - only 1 supporting source

  agent: analyst


pick_best_company:
  description: >
    Compare the researched companies and recommend the single best investment.

    Use only the supplied research.

  expected_output: >
    Return:

    - company_name
    - ticker
    - recommendation_reason (maximum 120 words)
    - confidence_score
    - 3 risks
    - only 1 source

  agent: reporting_analyst