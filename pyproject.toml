[project]
name = "stock"
version = "0.1.0"
description = "stock using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools,google-genai]==1.13.0",
    "crewai-tools==1.13.0",
    "reportlab>=4.4.10",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.1.1"
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.scripts]
stock = "stock.main:run"
run_crew = "stock.main:run"
train = "stock.main:train"
replay = "stock.main:replay"
test = "stock.main:test"
run_with_trigger = "stock.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.hatch.build.targets.wheel]
packages = ["src/stock"]
